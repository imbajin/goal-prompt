name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Discover exactly one installable skill
        run: |
          test "$(find skills -type f -name SKILL.md | wc -l)" -eq 1
          npx --yes skills@1.5.20 add . --list | tee /tmp/goal-prompt-skills.txt
          grep -q "goal-prompt" /tmp/goal-prompt-skills.txt

      - name: Validate installation for Codex and Claude Code
        env:
          HOME: /tmp/goal-prompt-home
        run: |
          mkdir -p "$HOME"
          npx --yes skills@1.5.20 add . -g -a codex -a claude-code -y --copy
          for installed in \
            "$HOME/.agents/skills/goal-prompt" \
            "$HOME/.claude/skills/goal-prompt"
          do
            diff -qr skills/goal-prompt "$installed"
            test ! -e "$installed/evals/skill-up"
            test ! -e "$installed/README.md"
            test ! -e "$installed/HANDOFF.md"
            test ! -e "$installed/CHANGELOG.md"
          done

      - name: Validate public metadata and eval definitions
        run: |
          python3 -m json.tool skills/goal-prompt/evals/evals.json >/dev/null
          python3 -m json.tool skills/goal-prompt/evals/trigger-evals.json >/dev/null
          test -f skills/goal-prompt/agents/openai.yaml
          grep -Fq "Use /goal-prompt" skills/goal-prompt/agents/openai.yaml
          ! grep -Fq '$goal-prompt' skills/goal-prompt/agents/openai.yaml

      - name: Check bundled references
        run: |
          test -f skills/goal-prompt/references/scenarios.md
          test -f skills/goal-prompt/references/long-goal-execution.md
          test -f skills/goal-prompt/references/long-goal-learning.md
          test -f docs/fusion-notes.md

      - name: Install evaluation audit test dependency
        run: |
          python3 -m venv .eval-work/ci-venv
          .eval-work/ci-venv/bin/python -m pip install --disable-pip-version-check -r evals/skill-up/requirements.txt

      - name: Check deterministic eval judges
        run: |
          bash -n evals/skill-up/fixtures/scripts/*.sh
          evals/skill-up/fixtures/scripts/test-judges.sh
          python3 evals/skill-up/fixtures/capacity-recovery/test-native-host-cleanup.py
          python3 evals/skill-up/fixtures/capacity-recovery/test_retry_policy.py
          python3 evals/skill-up/scripts/test-targeted-snapshot.py
          .eval-work/ci-venv/bin/python evals/skill-up/scripts/test-audit-discovery.py
          python3 evals/skill-up/scripts/test-request-outcomes.py

      - name: Validate skill-up definitions without model credentials
        run: |
          mkdir -p .eval-work/target
          cp -R skills/goal-prompt/. .eval-work/target/
          test -f .eval-work/target/SKILL.md
          mkdir -p /tmp/skill-up-bin
          export SKILL_UP_VERSION=v0.14.0
          export INSTALL_DIR=/tmp/skill-up-bin
          installer=/tmp/skill-up-install.sh
          curl -fsSL \
            https://raw.githubusercontent.com/alibaba/skill-up/53f6daecf4ac79e4e53ea53f3fe17dac3114debb/install.sh \
            -o "$installer"
          echo "2b7fbea303dc8b6feb09db6f9cc7307fb9263ff6cc4b0c68cdfe9c2897d109ef  $installer" \
            | sha256sum --check
          bash -n "$installer"
          bash "$installer"
          test "$(/tmp/skill-up-bin/skill-up --version)" = "skill-up version 0.14.0"
          /tmp/skill-up-bin/skill-up validate evals/skill-up/eval.yaml
          /tmp/skill-up-bin/skill-up run evals/skill-up/eval.yaml --dry-run

      - name: Verify multi-judge and expect gate semantics without a model
        run: |
          python3 evals/skill-up/scripts/test-skill-up-upgrade.py /tmp/skill-up-bin/skill-up

id: compaction-checkpoint
title: 长任务必须显式保存 compaction 进度
description: 验证最终目标和 state.md 契约不会遗漏进度、里程碑提交和当前完成事项摘要。
input:
  prompt: |
    你已经调查并给出简报。我明确确认深度模式：
    分阶段迁移 payments、orders、reports，使用 .goal-task/reporting/state.md；
    请生成最终 /goal。执行期间每个 productive loop 必须报告进度条、This loop、
    Remaining、Next；每个重大里程碑验证后要做本地 commit 并报告 commit 与当前完成事项；
    在 compaction、配额等待或交接前必须把完成项、剩余项、最新 commit、验证证据和下一步写入 state.md。
expect:
  must_contain: ["/goal", "state.md", "Progress", "commit"]
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-compaction-checkpoint.sh
  timeout_seconds: 30

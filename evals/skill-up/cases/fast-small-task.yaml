id: fast-small-task
title: 小型代码修复保持轻量
description: 验证单文件、低风险、测试明确的代码修复只使用 1 reviewer，不创建 sidecar 或扩大范围。
input:
  prompt: |
    你已经调查并给出简报。我明确确认快速模式：
    只修复 src/slugify.js 中 slugify(value) 的空白折叠问题，保持导出 API 不变；
    npm test 必须通过，不改依赖、测试或其他文件。请生成最终可复制的 /goal。
context:
  repo_fixture: evals/skill-up/fixtures/repos/slugify-app
  git:
    init: true
    checkout: main
expect:
  must_contain: ["/goal", "src/slugify.js", "npm test"]
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "最终 /goal 严格限制为 src/slugify.js，保持 slugify(value) 导出 API，并以 npm test 为验证门槛。"
    - "快速模式的小型低风险代码变更只要求 1 个独立 reviewer，不机械增加 3 reviewer。"
    - "不创建或引用 sidecar，不修改依赖、测试或其他文件，也不扩展为全局重构。"
  pass_threshold: 1.0

id: multiturn-confirmation
title: 同一会话中确认后才进入最终阶段
description: 验证首轮简报和次轮最终提示之间存在明确确认门槛。
input:
  turns:
    - role: user
      content: |
        请为“把 src/cache 重构成统一缓存适配层，同时保持公开 API 不变”创建 /goal。
    - role: user
      content: |
        我确认你刚才 brief 里的结果、范围、排除项和完成证据都不变，请直接生成最终 /goal。
expect:
  must_contain: ["/goal"]
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "第一轮语义上请用户确认结果、范围和完成证据，没有生成最终 /goal；不要求出现固定状态字符串。"
    - "第二轮把用户的明确确认视为授权，生成最终可执行 /goal，不重复要求确认。"
  pass_threshold: 1.0

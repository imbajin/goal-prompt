id: multiturn-confirmation
title: 同一会话中确认后才进入最终阶段
description: 验证首轮简报和次轮最终提示之间存在明确确认门槛。
input:
  turns:
    - role: user
      content: |
        请为“把 src/cache 重构为统一缓存适配层，同时保持公开 API 不变”创建 /goal。
      post_condition:
        must_contain_all: ["needs confirmation"]
        on_fail: fail
    - role: user
      content: |
        我确认你刚才简报中的结果、范围、排除项和完成证据，不做修改。请生成最终提示。
expect:
  must_contain: ["/goal"]
  exit_code: 0
judge:
  type: rule_based
  success:
    - turn_response_contains:
        turn: 1
        contains_any: ["needs confirmation"]
    - turn_response_contains:
        turn: 2
        contains_any: ["/goal"]
    - turn_response_not_contains:
        turn: 2
        not_contains: ["needs confirmation"]

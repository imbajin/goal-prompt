id: reviewer-stop-condition
title: Reviewer 不可用只能在其余工作完成后阻断
description: 验证行为变更目标不会因 reviewer 暂不可用而提前停止所有工作。
input:
  prompt: |
    你已经调查过并给了我 brief，我确认这个范围不变。
    请修复生产代码中的并发缺陷。实现和全部测试完成后，必须交给独立只读 reviewer 审查，
    审查发现问题并修复后还要重新审查。
    请生成最终 /goal，并写清 reviewer 暂时不可用时，哪些工作可以继续、什么时候才能整体阻塞。
expect:
  must_contain: ["/goal"]
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-reviewer-stop.sh
  timeout_seconds: 30

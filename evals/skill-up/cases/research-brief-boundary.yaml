id: research-brief-boundary
title: 研究 brief 区分证据和偏好
description: 覆盖研究场景臆造仓库事实、提前生成目标和机械加入代码 reviewer 的问题。
input:
  prompt: |
    请先为“比较两个缓存实现并支持架构负责人选择”做只读研究 brief。
    当前没有提供仓库、实现、测试或接口资料；我还没有确认最终范围。
    请区分证据缺口与用户偏好，不要生成最终 /goal，也不要把行为变更 reviewer 当成默认门槛。
expect:
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-research-brief.sh
  timeout_seconds: 30

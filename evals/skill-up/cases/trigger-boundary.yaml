id: trigger-boundary
title: 普通任务不能被强制转成 goal
description: 验证用户明确不需要 /goal 时，Skill 不会创建 goal 工件。
input:
  prompt: |
    不要创建或讨论 /goal。只用一句话告诉我，怎么把 README 里的 teh 改成 the。
expect:
  must_not_contain: ["needs confirmation"]
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-trigger-boundary.sh
  timeout_seconds: 30

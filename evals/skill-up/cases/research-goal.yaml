id: research-goal
title: 只读研究目标围绕决策和证据
description: 验证 research 场景强调要支持的决策、证据来源和只读边界。
input:
  prompt: |
    请先帮我整理一份只读研究 brief，比较仓库现有的两种缓存实现，
    最后支持架构负责人决定保留哪一种。
    报告必须引用文件、行号和测试证据，不能修改代码。
    我还没确认最终范围，这一轮不要直接生成最终 /goal。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "把研究要支持的架构决策和证据标准写清楚，而不是把“研究”本身当作结果。"
    - "明确只读范围、真实引用要求、缺失证据与用户偏好的区别。"
    - "没有机械加入行为变更代码所需的独立 reviewer 门槛，也没有提前生成最终 /goal；允许按 research 规则要求 1 名只读报告 reviewer 复核引用与结论；语义上请用户确认即可，不要求固定状态字符串。"
  pass_threshold: 1.0

id: parallel-agents-goal
title: 并行任务必须有独立边界和集成责任
description: 验证多 agent 拆分拥有独立文件边界、共享写入点唯一归属和集成复验。
input:
  prompt: |
    你已经调查过并给了我 brief，我确认使用深度模式。
    请把 auth、billing、notifications 这三个互不依赖的模块迁移到统一事件接口，保持公开兼容。
    生成最终 /goal 时，说明怎样合理使用子 agents 并行，明确每个 agent 的文件所有权，
    指定共享 schema 和 lockfile 的唯一 owner，写清接缝集成责任和集成后的测试重跑。
    并行实现不能代替独立 reviewer。
expect:
  must_contain: ["/goal", "auth", "billing", "notifications"]
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-parallel-agents.sh
  timeout_seconds: 30

id: confirmation-brief
title: 未确认前只输出 brief
description: 覆盖历史上首轮直接生成最终 /goal 的问题，检查确认门而非固定措辞。
input:
  prompt: |
    请先看一下当前仓库，帮我把认证中间件迁移整理成一个可执行目标的 brief。
    结果、范围和完成证据我还没确认。
    这一轮只给调查结论和需要我决定的关键问题，不要直接给最终可复制的 /goal。
expect:
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-confirmation-brief.sh
  timeout_seconds: 30

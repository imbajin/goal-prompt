id: confirmation-brief
title: 未确认前只输出 brief
description: 覆盖历史上首轮直接生成最终 /goal 的问题，检查确认门而非固定措辞。
input:
  prompt: |
    请先检查当前仓库，为认证中间件迁移整理一个可执行目标的 brief。
    我还没有确认结果、范围或完成证据；这一轮只要调查结论和需要我确认的关键问题，
    不要生成最终可复制的 /goal。
expect:
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-confirmation-brief.sh
  timeout_seconds: 30

id: stage2-doc
title: 普通文档目标保持轻量
description: 验证已确认的文档目标会生成简洁提示，不添加 sidecar 或多 reviewer 门槛。
input:
  prompt: |
    你已经调查过仓库并给了我 brief，我确认范围不变。
    只更新 docs/getting-started.md，让新贡献者能完成安装。
    npm run docs:check 必须通过，代码和依赖都不要改。
    现在请直接输出最终可复制的 /goal。
expect:
  must_contain: ["/goal"]
  exit_code: 0
judge:
  type: script
  script_path: skill-up/fixtures/scripts/check-stage2-doc.sh
  timeout_seconds: 30

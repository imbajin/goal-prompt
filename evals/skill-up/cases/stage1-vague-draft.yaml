id: stage1-vague-draft
title: 模糊草稿不能直接润色成交付物
description: 验证 Skill 会识别活动型目标和单一测试门槛，而不是直接输出最终提示。
input:
  prompt: |
    请帮我审一下并缩短这段草稿：
    /goal 改进整个代码库，测试通过就停止。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "指出“改进整个代码库”缺少可观察的完成后状态，并且“测试通过”不能单独证明所有范围完成。"
    - "没有在用户确认结果、范围和完成证据前输出最终 /goal，并在语义上请用户确认或补充决定。"
    - "问题数量保持在一到三个，并且每个问题都会实质改变最终目标。"
  pass_threshold: 1.0

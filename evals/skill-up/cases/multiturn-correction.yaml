id: multiturn-correction
title: 用户明确新范围并要求继续时视为授权
description: 验证用户实质改变目标但已明确新范围并要求继续时，不重复索取确认。
input:
  turns:
    - role: user
      content: |
        请为“只重构 src/cache，保持公开 API 不变”创建 /goal。
    - role: user
      content: |
        改一下：除了重构缓存，还要更改公开 API，并迁移所有调用方。请按新范围继续。
expect:
  must_contain: ["/goal"]
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "第一轮调查并给出待确认 brief，没有提前生成最终 /goal；只要求语义确认，不要求固定状态字符串。"
    - "第二轮把用户给出的新范围和“请按新范围继续”视为明确授权，完成必要判断并生成最终 /goal，不重复索取确认。"
  pass_threshold: 1.0

id: multiturn-correction
title: 用户改口后必须重新确认
description: 验证第二轮实质改变目标时仍停留在 Stage 1。
input:
  turns:
    - role: user
      content: |
        请为“只重构 src/cache，保持公开 API 不变”创建 /goal。
      post_condition:
        must_contain_all: ["needs confirmation"]
        on_fail: fail
    - role: user
      content: |
        改一下：除了重构缓存，还要更改公开 API，并迁移所有调用方。请按新范围继续。
expect:
  must_contain: ["needs confirmation"]
  must_not_contain: ["\nready"]
  exit_code: 0
judge:
  type: rule_based
  success:
    - turn_response_contains:
        turn: 2
        contains_any: ["needs confirmation"]
    - turn_response_not_contains:
        turn: 2
        not_contains: ["\nready"]

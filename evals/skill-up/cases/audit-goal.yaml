id: audit-goal
title: Gatekeeper 审查保持只读并给出有限判定
description: 验证发布审查围绕权威基线、实际 diff、检查证据和明确 verdict。
input:
  prompt: |
    请帮我写一个 /goal，只读检查当前分支能不能发布。
    以 RELEASE.md 为准，核对最终 diff 和现有 CI 结果。
    结论只能是 ready、needs work 或 blocked。不要修改文件，也不要 push、merge 或 rebase。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "简报保留 RELEASE.md、最终 diff、CI 证据和三值 verdict 作为审查核心。"
    - "明确保持只读，排除实现、推送、合并和 rebase。"
    - "Stage 1 简报对每条发现要求严重级别、精确位置、证据和建议，并在确认前不生成最终 /goal；语义上请用户确认即可，不要求固定状态字符串。"
  pass_threshold: 1.0

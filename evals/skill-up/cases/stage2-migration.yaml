id: stage2-migration
title: 复杂迁移保留状态与独立复审
description: 验证已确认的行为变更目标包含最小持久状态、阻塞重排和 reviewer 门槛。
input:
  prompt: |
    你已经调查过并给了我 brief，我确认范围不变。
    请迁移 auth 模块的实现、测试和 CI，同时保持公开行为兼容。
    用 .goal-task/auth-migration/state.md 保存可以恢复的实时状态。
    所有范围内的测试和 CI 都必须通过，独立 reviewer 是必须经过的门槛。
    请直接输出最终可复制的 /goal。
expect:
  must_contain: ["/goal", ".goal-task/auth-migration/state.md"]
  exit_code: 0
judges:
  - id: rendered-goal
    type: script
    script_path: skill-up/fixtures/scripts/check-goal-char-limit.py
    timeout_seconds: 30
  - id: migration-contract
    type: agent_judge
    engine:
      name: codex
      version: "0.164.0"
      model:
        provider: openai
        name: gpt-6-luna
    context:
      profile: minimal
      final_message: include
      transcript: omit
      workspace_diff: include
      generated_files: include
      limits: {max_bytes: 65536}
    criteria:
      - "本例评估生成的目标及实际提供的执行约定，不要求现在执行迁移或得到测试结果。最终目标保留 auth 实现、测试及 CI 迁移、公开行为兼容和指定 state.md 恢复入口；所有范围内测试与 CI 通过才可完成，不把门槛降为可选。"
      - "主要行为变更里程碑和最终集成都必须经过独立审查；仅在最终完成前安排审查不足以满足要求。修复审查问题后，对受影响变更复审。只根据目标及实际提供的执行契约判断，不能从文件名推断缺失的契约。"
      - "单项等待、失败或审查不可用时继续可独立工作；只有恢复和重排后所有有意义的剩余工作共同受阻且符合宿主规则，才允许整体 blocked。区分禁止停止与禁止继续，识别否定的真实作用对象及矛盾指令；不要求特定句式。"
    pass_threshold: 1.0

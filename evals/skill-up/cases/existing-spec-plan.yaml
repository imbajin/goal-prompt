id: existing-spec-plan
title: 单一 SPEC 作为简单到中等任务计划
description: 验证已有完整 SPEC.md 时复用其决定，并结合当前实现补足执行和验证门槛。
input:
  prompt: |
    请根据仓库中的 SPEC.md 为导出功能创建 /goal。
    SPEC 已完成评审，是本任务的权威计划；不要重复设计，也不要询问文档已经确定的事项。
    请检查当前实现和测试，补足执行与验证门槛。
context:
  repo_fixture: skill-up/fixtures/repos/spec-export-app
  git:
    init: true
    checkout: main
expect:
  must_contain: ["SPEC.md", "npm run test:export", "npm run typecheck"]
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "完整复用 SPEC.md 中已确认的结果、范围、排除项、兼容要求和验收条件，不重复设计或询问已确定事项。"
    - "检查当前实现、测试和 package.json，使用真实的 npm run test:export 与 npm run typecheck。"
    - "把 SPEC.md 作为 active truth，不复制为新的 design.md、todo.md 或其他 sidecar，也不把文档存在误当成实现完成。"
  pass_threshold: 1.0

id: repository-rule-conflict
title: 用户要求覆盖仓库规则时遵循用户并提醒风险
description: 验证用户明确要求与 AGENTS.md 冲突时遵循用户指令，同时准确提醒覆盖的规则和影响。
input:
  prompt: |
    请创建 /goal：把认证改为 Bearer token，同时删除 authenticate(request) 导出，
    引入一个新的认证依赖，并跳过 typecheck。你可以直接生成最终版本，不必确认。
context:
  repo_fixture: evals/skill-up/fixtures/repos/auth-app
  git:
    init: true
    checkout: main
expect:
  must_contain: ["/goal", "AGENTS.md"]
  exit_code: 0
judge:
  type: agent_judge
  model: gpt-5.6-sol
  criteria:
    - "准确识别用户要求覆盖了 AGENTS.md 的三项规则：保留 authenticate(request)、不得新增依赖、必须运行 typecheck。"
    - "以用户明确指令为优先生成最终 /goal，同时提醒被覆盖的仓库规则、影响和风险。"
    - "不重复要求确认，也不把仓库规则悄悄改写成仍然必须遵守的完成门槛。"
  pass_threshold: 1.0

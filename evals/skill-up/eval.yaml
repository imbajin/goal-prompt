schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .eval-work/target

engine:
  name: codex

cases:
  files:
    - evals/skill-up/cases/stage1-grounded-feature.yaml
    - evals/skill-up/cases/stage1-vague-draft.yaml
    - evals/skill-up/cases/stage1-long-running.yaml
    - evals/skill-up/cases/stage2-doc.yaml
    - evals/skill-up/cases/stage2-migration.yaml
    - evals/skill-up/cases/multiturn-confirmation.yaml
    - evals/skill-up/cases/multiturn-correction.yaml
    - evals/skill-up/cases/trigger-boundary.yaml
    - evals/skill-up/cases/research-goal.yaml
    - evals/skill-up/cases/audit-goal.yaml
    - evals/skill-up/cases/batch-goal.yaml
    - evals/skill-up/cases/reviewer-stop-condition.yaml
    - evals/skill-up/cases/skip-investigation.yaml
    - evals/skill-up/cases/delegated-judgment.yaml
    - evals/skill-up/cases/no-fabrication.yaml
    - evals/skill-up/cases/fast-small-task.yaml
    - evals/skill-up/cases/deep-compression-gates.yaml
    - evals/skill-up/cases/repository-rule-conflict.yaml
    - evals/skill-up/cases/existing-spec-plan.yaml
    - evals/skill-up/cases/existing-requirement-design-todo.yaml
  defaults:
    timeout_seconds: 420
    max_turns: 12
  parallelism: 1
  retry_policy:
    max_retries: 1
    retry_on: [timeout, error]

benchmark:
  enabled: true

report:
  formats: [json, html]
  artifacts: [transcript]

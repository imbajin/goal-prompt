schema_version: v1alpha1
environment:
  type: none
skills:
- source: local_path
  path: target/goal-prompt
engine:
  name: codex
  model:
    provider: openai
    name: gpt-6.1-sol
  version: 0.164.0
judge:
  model: gpt-6.1-terra
cases:
  files:
  - skill-up/cases/confirmation-brief.yaml
  defaults:
    timeout_seconds: 420
    max_turns: 12
    collect_artifacts:
    - .goal-task/**/*.md
  parallelism: 1
  retry_policy:
    max_retries: 1
    retry_on:
    - timeout
    - error
benchmark:
  enabled: false
report:
  formats:
  - json
  - html
  artifacts:
  - transcript
